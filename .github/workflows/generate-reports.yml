# 수동 실행 시 provider 선택:
#   claude → ubuntu-latest + ANTHROPIC_API_KEY
#   codex  → self-hosted codex runner + ChatGPT auth

name: generate-reports

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "특정 repo 하나만 강제 실행 (빈칸이면 전체)"
        required: false
        type: string
      force:
        description: "자동 게이트를 무시하고 리포트 재발행 (SHA 동일해도 실행)"
        required: false
        type: boolean
        default: false
      provider:
        description: "리뷰 생성 도구"
        required: false
        type: choice
        options: [claude, codex]
        default: claude
      model:
        description: "모델 (claude: claude-sonnet-4-6 등 / codex: gpt-5.5 등, 빈칸이면 기본값)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  ORG: NulMa
  REPORT_RATE_WINDOW_HOURS: "1"
  REPORT_RATE_MAX: "5"
  REPORT_RATE_COOLDOWN_HOURS: "3"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  # ===========================================================================
  # discover
  # ===========================================================================
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      repos: ${{ steps.list.outputs.repos }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: List target repos
        id: list
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail

          if [[ -n "${TARGET_REPO:-}" ]]; then
            echo "[info] workflow_dispatch target_repo override: $TARGET_REPO" >&2
            repos=$(jq -cn --arg r "$TARGET_REPO" '[$r]')
          else
            repos="$(bash scripts/list-target-repos.sh)"
          fi

          count=$(jq 'length' <<<"$repos")
          echo "[info] discovered $count repo(s): $repos" >&2

          echo "repos=$repos" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

          {
            echo "## Discover"
            echo ""
            echo "- **provider:** \`${{ inputs.provider }}\`"
            echo "- **repos found:** $count"
            echo "- **list:** \`$repos\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # review
  # ===========================================================================
  review:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ${{ inputs.provider == 'codex' && fromJSON('["self-hosted", "codex"]') || 'ubuntu-latest' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        repo: ${{ fromJson(needs.discover.outputs.repos) }}
    concurrency:
      group: report-${{ matrix.repo }}
      cancel-in-progress: false
    timeout-minutes: 25
    steps:
      - name: Checkout _dashboard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Codex 전용: Windows self-hosted runner 툴 준비
      - name: Prepare Windows runner tools
        if: inputs.provider == 'codex'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $bin = Join-Path $env:RUNNER_TEMP "codex-tools"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          $jq = Join-Path $bin "jq.exe"
          if (!(Test-Path $jq)) {
            Invoke-WebRequest `
              -Uri "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-windows-amd64.exe" `
              -OutFile $jq
          }

          Set-Content -Path (Join-Path $bin "python3") -Encoding ascii -Value @(
            "#!/usr/bin/env bash",
            'python "$@"'
          )
          Set-Content -Path (Join-Path $bin "pip3") -Encoding ascii -Value @(
            "#!/usr/bin/env bash",
            'python -m pip "$@"'
          )

          Add-Content -Path $env:GITHUB_PATH -Value $bin

          $npmPrefix = (npm config get prefix).Trim()
          Add-Content -Path $env:GITHUB_PATH -Value $npmPrefix
          $codexCmd = (Join-Path $npmPrefix "codex.cmd") -replace "\\", "/"
          Add-Content -Path $env:GITHUB_ENV -Value "CODEX_BIN=$codexCmd"

      - name: Reconcile report directory
        id: report_dir
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
          REPO: ${{ matrix.repo }}
        run: |
          set -euo pipefail
          bash scripts/reconcile-report-dir.sh "$REPO"

      - name: Check gates
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
          FORCE: ${{ inputs.force }}
          REPO: ${{ matrix.repo }}
        run: |
          set -euo pipefail

          if [[ "${FORCE:-false}" == "true" ]]; then
            echo "[info] force=true - bypassing automatic report gates" >&2

            DEFAULT_BRANCH=$(gh api "repos/${ORG}/${REPO}" --jq '.default_branch')
            CURRENT_SHA=$(gh api "repos/${ORG}/${REPO}/commits/${DEFAULT_BRANCH}" --jq '.sha')

            META="reports/${REPO}/.meta.json"
            if [[ -f "$META" ]]; then
              LAST_SHA=$(jq -r '.last_sha // ""' "$META")
            else
              LAST_SHA=""
            fi

            SHOULD=true
            if [[ -n "$LAST_SHA" && "$CURRENT_SHA" == "$LAST_SHA" ]]; then
              COMMIT_COUNT=0
              REASON="force=true (manual refresh; SHA unchanged)"
            else
              COMMIT_COUNT="?"
              REASON="force=true (manual bypass)"
            fi

            FIRST=$([[ -z "$LAST_SHA" ]] && echo true || echo false)

            {
              echo "should_run=$SHOULD"
              echo "current_sha=$CURRENT_SHA"
              echo "last_sha=$LAST_SHA"
              echo "commit_count=$COMMIT_COUNT"
              echo "first_report=$FIRST"
              echo "reason=$REASON"
            } >> "$GITHUB_OUTPUT"
          else
            bash scripts/check-needs-report.sh "$REPO"
          fi

      - name: Commit reconciled report directory
        id: push_reconcile
        if: steps.report_dir.outputs.changed == 'true' && steps.gate.outputs.should_run != 'true'
        shell: bash
        env:
          REPO:   ${{ matrix.repo }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"

          git add -A reports

          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MSG="chore(reports): reconcile ${REPO} history"
          git commit -m "$MSG"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "[info] pushed reconciliation on attempt $attempt"
              break
            fi
            git fetch origin "$BRANCH"
            git rebase "origin/${BRANCH}" || { git rebase --abort || true; exit 1; }
            [[ $attempt -eq 3 ]] && exit 1
          done

          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Ensure Python deps
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml

      - name: Build prompt
        id: prompt
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
          FROM_SHA: ${{ steps.gate.outputs.last_sha }}
          TO_SHA:   ${{ steps.gate.outputs.current_sha }}
          REPO:     ${{ matrix.repo }}
        run: |
          set -euo pipefail

          OUT="/tmp/final-prompt-${REPO//\//__}.md"
          FACTS="/tmp/final-prompt-${REPO//\//__}.clone-facts.json"

          path=$(
            OUTPUT_PATH="$OUT" \
            CLONE_FACTS_PATH="$FACTS" \
            TARGET_DIR="/tmp/target-${REPO//\//__}" \
              bash scripts/run-claude-review.sh \
                "$REPO" \
                "${FROM_SHA:-}" \
                "$TO_SHA"
          )

          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "facts=$FACTS" >> "$GITHUB_OUTPUT"
          echo "[info] prompt bytes: $(wc -c <"$path")" >&2

      # ── Claude 경로 ──────────────────────────────────────────────────────
      - name: Run Claude review
        id: run_claude
        if: steps.gate.outputs.should_run == 'true' && inputs.provider == 'claude'
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ inputs.model || 'claude-sonnet-4-6' }}
          PROMPT_FILE: ${{ steps.prompt.outputs.path }}
          REPO: ${{ matrix.repo }}
        run: |
          set -euo pipefail
          pip3 install --quiet anthropic

          TS=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          OUT_DIR="reports/${REPO}"
          OUT_FILE="${OUT_DIR}/${TS}.md"
          mkdir -p "$OUT_DIR"

          TMP=$(mktemp)
          python3 - <<'PYEOF' > "$TMP"
import anthropic, os, sys
client = anthropic.Anthropic()
prompt = open(os.environ["PROMPT_FILE"], encoding="utf-8").read()
msg = client.messages.create(
    model=os.environ.get("CLAUDE_MODEL", "claude-sonnet-4-6"),
    max_tokens=8192,
    messages=[{"role": "user", "content": prompt}],
)
sys.stdout.write(msg.content[0].text)
PYEOF

          if [[ ! -s "$TMP" ]]; then
            echo "::error::Claude output empty for $REPO"
            rm -f "$TMP"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          VALIDATE_ARGS=(scripts/validate-report.py "$TMP" --project "$REPO" --strict --new-report)
          META="reports/${REPO}/.meta.json"
          REPORTS_DIR="reports/${REPO}"
          if [[ -d "$REPORTS_DIR" ]]; then
            VALIDATE_ARGS+=(--reports-dir "$REPORTS_DIR" --enforce-backlog-ledger)
          elif [[ -f "$META" ]]; then
            PREVIOUS_REPORT="$(jq -r '.last_report_file // ""' "$META")"
            if [[ -n "$PREVIOUS_REPORT" && -f "$PREVIOUS_REPORT" ]]; then
              VALIDATE_ARGS+=(--previous-report "$PREVIOUS_REPORT" --enforce-backlog-carryover)
            fi
          fi

          if ! python3 "${VALIDATE_ARGS[@]}"; then
            echo "::error::validator rejected output for $REPO"
            rm -f "$TMP"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          mv "$TMP" "$OUT_FILE"
          {
            echo "out_file=$OUT_FILE"
            echo "timestamp=$TS"
            echo "status=success"
          } >> "$GITHUB_OUTPUT"

      # ── Codex 경로 ───────────────────────────────────────────────────────
      - name: Ensure Codex CLI
        if: steps.gate.outputs.should_run == 'true' && inputs.provider == 'codex'
        shell: bash
        run: |
          set -euo pipefail
          CODEX_CMD="${CODEX_BIN:-codex}"
          VERSION_OUT="$(mktemp)"
          if "$CODEX_CMD" --version >"$VERSION_OUT" 2>&1; then
            echo "[info] Codex CLI: $(head -n 1 "$VERSION_OUT")" >&2
            rm -f "$VERSION_OUT"; exit 0
          fi
          for attempt in 1 2 3; do
            npm i -g @openai/codex@latest && break
            [[ "$attempt" == "3" ]] && exit 1
            sleep $((attempt * 5))
          done
          "$CODEX_CMD" --version
          rm -f "$VERSION_OUT"

      - name: Verify Codex ChatGPT auth
        if: steps.gate.outputs.should_run == 'true' && inputs.provider == 'codex'
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_HOME="${CODEX_HOME:-$HOME/.codex}"
          AUTH_FILE="$CODEX_HOME/auth.json"
          if [[ ! -f "$AUTH_FILE" ]]; then
            echo "::error::Codex auth cache missing at $AUTH_FILE"
            exit 1
          fi
          chmod 700 "$CODEX_HOME"; chmod 600 "$AUTH_FILE"
          if ! jq -e '.auth_mode == "chatgpt" and ((.tokens.refresh_token // "") != "")' "$AUTH_FILE" >/dev/null; then
            echo "::error::Codex auth cache is not ChatGPT-managed auth with a refresh token."
            exit 1
          fi

      - name: Run Codex review
        id: run_codex
        if: steps.gate.outputs.should_run == 'true' && inputs.provider == 'codex'
        shell: bash
        env:
          PROMPT_FILE: ${{ steps.prompt.outputs.path }}
          REPO: ${{ matrix.repo }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          unset OPENAI_API_KEY OPENAI_ORG_ID OPENAI_PROJECT_ID
          export CODEX_HOME="${CODEX_HOME:-$HOME/.codex}"

          TS=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          OUT_DIR="reports/${REPO}"
          OUT_FILE="${OUT_DIR}/${TS}.md"
          mkdir -p "$OUT_DIR"

          TMP=$(mktemp)
          CODEX_STDOUT=$(mktemp)
          CODEX_CMD="${CODEX_BIN:-codex}"
          if "$CODEX_CMD" --ask-for-approval never exec \
              --model "${{ inputs.model || 'gpt-5.5' }}" \
              --sandbox read-only \
              --output-last-message "$TMP" \
              - < "$PROMPT_FILE" > "$CODEX_STDOUT"; then
            if [[ ! -s "$TMP" && -s "$CODEX_STDOUT" ]]; then cp "$CODEX_STDOUT" "$TMP"; fi
            if [[ ! -s "$TMP" ]]; then
              echo "::error::Codex output empty for $REPO"
              rm -f "$TMP" "$CODEX_STDOUT"
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            VALIDATE_ARGS=(scripts/validate-report.py "$TMP" --project "$REPO" --strict --new-report)
            META="reports/${REPO}/.meta.json"
            REPORTS_DIR="reports/${REPO}"
            if [[ -d "$REPORTS_DIR" ]]; then
              VALIDATE_ARGS+=(--reports-dir "$REPORTS_DIR" --enforce-backlog-ledger)
            elif [[ -f "$META" ]]; then
              PREVIOUS_REPORT="$(jq -r '.last_report_file // ""' "$META")"
              if [[ -n "$PREVIOUS_REPORT" && -f "$PREVIOUS_REPORT" ]]; then
                VALIDATE_ARGS+=(--previous-report "$PREVIOUS_REPORT" --enforce-backlog-carryover)
              fi
            fi

            if ! python3 "${VALIDATE_ARGS[@]}"; then
              echo "::error::validator rejected output for $REPO"
              rm -f "$TMP" "$CODEX_STDOUT"
              echo "status=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            mv "$TMP" "$OUT_FILE"
            rm -f "$CODEX_STDOUT"
            {
              echo "out_file=$OUT_FILE"
              echo "timestamp=$TS"
              echo "status=success"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::error::Codex call failed for $REPO"
            rm -f "$TMP" "$CODEX_STDOUT"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # ── 공통: 두 경로 출력 통합 ──────────────────────────────────────────
      - name: Merge run outputs
        id: run
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        env:
          CLAUDE_STATUS:   ${{ steps.run_claude.outputs.status }}
          CODEX_STATUS:    ${{ steps.run_codex.outputs.status }}
          CLAUDE_OUT_FILE: ${{ steps.run_claude.outputs.out_file }}
          CODEX_OUT_FILE:  ${{ steps.run_codex.outputs.out_file }}
          CLAUDE_TS:       ${{ steps.run_claude.outputs.timestamp }}
          CODEX_TS:        ${{ steps.run_codex.outputs.timestamp }}
        run: |
          set -euo pipefail
          STATUS="${CLAUDE_STATUS:-${CODEX_STATUS:-skipped}}"
          OUT_FILE="${CLAUDE_OUT_FILE:-${CODEX_OUT_FILE:-}}"
          TS="${CLAUDE_TS:-${CODEX_TS:-}}"
          echo "status=$STATUS"    >> "$GITHUB_OUTPUT"
          echo "out_file=$OUT_FILE" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TS"     >> "$GITHUB_OUTPUT"

      - name: Update meta.json
        if: steps.run.outputs.status == 'success'
        shell: bash
        env:
          GH_TOKEN:    ${{ secrets.REPO_PAT }}
          REPO:        ${{ matrix.repo }}
          CURRENT_SHA: ${{ steps.gate.outputs.current_sha }}
          OUT_FILE:    ${{ steps.run.outputs.out_file }}
          FACTS_FILE:  ${{ steps.prompt.outputs.facts }}
        run: |
          set -euo pipefail
          META="reports/${REPO}/.meta.json"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)

          if [[ -f "$META" ]]; then
            PREV_COUNT=$(jq -r '.report_count // 0' "$META")
            PREV_JSON=$(cat "$META")
          else
            PREV_COUNT=0
            PREV_JSON='{}'
          fi
          NEW_COUNT=$((PREV_COUNT + 1))

          if [[ -n "${FACTS_FILE:-}" && -f "$FACTS_FILE" ]]; then
            FACTS_JSON=$(cat "$FACTS_FILE")
          else
            FACTS_JSON='{}'
          fi

          REPO_JSON=$(
            gh api "repos/${ORG}/${REPO}" \
              --jq '{repo_id:.id, repo_node_id:.node_id, repo_name:.name, repo_full_name:.full_name}' \
              2>/dev/null || echo '{}'
          )

          jq -n \
            --argjson prev "$PREV_JSON" \
            --arg sha   "$CURRENT_SHA" \
            --arg at    "$NOW" \
            --arg file  "$OUT_FILE" \
            --argjson n "$NEW_COUNT" \
            --argjson repo "$REPO_JSON" \
            --argjson facts "$FACTS_JSON" \
            '$prev + {
                last_sha: $sha,
                last_report_at: $at,
                last_report_file: $file,
                report_count: $n,
                recent_report_ats: (
                  (($prev.recent_report_ats // []) + [$at])
                  | unique | sort
                  | if length > 200 then .[-200:] else . end
                )
              } + $repo + $facts' \
            > "$META"

      - name: Commit and push reports
        id: push_reports
        if: steps.run.outputs.status == 'success'
        shell: bash
        env:
          REPO:        ${{ matrix.repo }}
          CURRENT_SHA: ${{ steps.gate.outputs.current_sha }}
          BRANCH:      ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"

          git add -A reports

          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHORT="${CURRENT_SHA:0:7}"
          MSG="chore(reports): update ${REPO} (${SHORT})"
          git commit -m "$MSG"

          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "[info] pushed on attempt $attempt"
              break
            fi
            git fetch origin "$BRANCH"
            git rebase "origin/${BRANCH}" || { git rebase --abort || true; exit 1; }
            [[ $attempt -eq 3 ]] && exit 1
          done

          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Write cell summary
        if: always()
        shell: bash
        env:
          REPO:             ${{ matrix.repo }}
          SHOULD_RUN:       ${{ steps.gate.outputs.should_run }}
          REASON:           ${{ steps.gate.outputs.reason }}
          FIRST_REPORT:     ${{ steps.gate.outputs.first_report }}
          COMMIT_COUNT:     ${{ steps.gate.outputs.commit_count }}
          CURRENT_SHA:      ${{ steps.gate.outputs.current_sha }}
          RUN_STATUS:       ${{ steps.run.outputs.status }}
          OUT_FILE:         ${{ steps.run.outputs.out_file }}
          REPORTS_PUSHED:   ${{ steps.push_reports.outputs.pushed }}
          RECONCILE_PUSHED: ${{ steps.push_reconcile.outputs.pushed }}
          SUMMARY_DIR:      ${{ runner.temp }}/summary
        run: |
          set -euo pipefail
          mkdir -p "$SUMMARY_DIR"
          SAFE="${REPO//\//__}"
          SUMMARY_FILE="${SUMMARY_DIR}/${SAFE}.json"
          export SUMMARY_FILE
          python3 -c '
import json, os
data = {
  "repo": os.environ.get("REPO", ""),
  "should_run": os.environ.get("SHOULD_RUN") or "unknown",
  "reason": os.environ.get("REASON") or "gate step failed before emit",
  "first_report": os.environ.get("FIRST_REPORT", ""),
  "commit_count": os.environ.get("COMMIT_COUNT") or "0",
  "current_sha": os.environ.get("CURRENT_SHA", ""),
  "run_status": os.environ.get("RUN_STATUS") or "skipped",
  "out_file": os.environ.get("OUT_FILE", ""),
  "reports_pushed": os.environ.get("REPORTS_PUSHED") or "false",
  "reconcile_pushed": os.environ.get("RECONCILE_PUSHED") or "false",
}
open(os.environ["SUMMARY_FILE"], "w", encoding="utf-8").write(json.dumps(data, ensure_ascii=False) + "\n")
'

      - name: Upload cell summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-${{ matrix.repo }}
          path: ${{ runner.temp }}/summary/*.json
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # summary
  # ===========================================================================
  summary:
    needs: review
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download all cell summaries
        uses: actions/download-artifact@v4
        with:
          pattern: summary-*
          path: /tmp/summary
          merge-multiple: true
        continue-on-error: true

      - name: Render summary table
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(/tmp/summary/*.json)
          {
            echo "# 리뷰 생성 결과"
            echo ""
            echo "- **trigger:** \`${{ github.event_name }}\`"
            echo "- **provider:** \`${{ inputs.provider }}\`"
            echo "- **run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- **cells:** ${#FILES[@]}"
            echo ""
            if (( ${#FILES[@]} == 0 )); then
              echo "_no cell summaries collected_"
              exit 0
            fi
            echo "| Repo | should_run | status | reason | commits | report |"
            echo "|---|---|---|---|---|---|"
            for f in "${FILES[@]}"; do
              repo=$(jq -r .repo "$f")
              sr=$(jq -r .should_run "$f")
              st=$(jq -r .run_status "$f")
              rn=$(jq -r .reason "$f" | sed 's/|/\\|/g')
              cc=$(jq -r .commit_count "$f")
              of=$(jq -r .out_file "$f")
              rep_cell=$([[ -n "$of" && "$of" != "null" ]] && echo "\`${of#reports/}\`" || echo "—")
              echo "| \`$repo\` | $sr | $st | $rn | $cc | $rep_cell |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(/tmp/summary/*.json)
          SHOULD_DEPLOY=false
          for f in "${FILES[@]}"; do
            if jq -e '(.reports_pushed == "true") or (.reconcile_pushed == "true")' "$f" >/dev/null; then
              SHOULD_DEPLOY=true; break
            fi
          done
          if [[ "$SHOULD_DEPLOY" != "true" ]]; then
            echo "[info] no pushed report changes; skipping Pages deploy dispatch" >&2
            exit 0
          fi
          gh api "repos/${REPOSITORY}/dispatches" \
            --method POST \
            -f event_type=reports_changed \
            -F "client_payload[run_id]=${GITHUB_RUN_ID}" \
            -F "client_payload[run_number]=${GITHUB_RUN_NUMBER}"
